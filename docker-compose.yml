services:
  secret-drop:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LISTEN: "0.0.0.0:8080"
      DATA_DIR: "/data"
    volumes:
      - ./secrets:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - secret-drop
    # Quick tunnel (temporary) — Cloudflare will issue a random trycloudflare.com hostname.
    # That hostname is printed to the container logs on startup.
    command: tunnel --url http://secret-drop:8080
