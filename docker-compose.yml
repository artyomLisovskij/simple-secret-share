services:
  secret-drop:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LISTEN: "0.0.0.0:8080"
      DATA_DIR: "/data"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./secrets:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
